[package]
name = "splinely-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "splinely-cli"
path = "src/main.rs"

[dependencies]
splinely_document = { path = "../splinely_document" }
serde_json = "1"
serde = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
svgtypes = "0.15"

[dev-dependencies]
base64 = "0.22"
