[package]
name = "splinely_viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "splinely-viewer"
path = "src/main.rs"

[features]
default = ["webview"]
webview = ["dep:wry", "dep:tao", "dep:webkit2gtk"]

[dependencies]
splinely_document.workspace = true
splinely_runtime = { path = "../splinely_runtime" }
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
roxmltree = "0.20"
same-file = "1"
tempfile = "3"
wry = { version = "0.57", optional = true }
tao = { version = "0.37", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", features = ["v2_20"], optional = true }
