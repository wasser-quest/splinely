[workspace]
members = ["crates/splinely_document", "crates/splinely_editor", "crates/splinely_cli", "crates/splinely_viewer", "crates/splinely_runtime"]
resolver = "2"

[workspace.package]
version = "0.5.4"
edition = "2021"
license = "MIT"
repository = "https://github.com/wasser-quest/splinely"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
splinely_document = { path = "crates/splinely_document" }

[profile.release]
strip = "symbols"
