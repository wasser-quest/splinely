[workspace]
members = ["crates/forma_document", "crates/forma_editor", "crates/forma_cli", "crates/forma_viewer", "crates/forma_runtime"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
forma_document = { path = "crates/forma_document" }

[profile.release]
strip = "symbols"
