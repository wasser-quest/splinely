name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload (e.g. v0.3.0)
        required: true

permissions:
  contents: write

jobs:
  linux-x86_64:
    # Oldest supported Ubuntu keeps the glibc requirement low (2.35).
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Tag pushes build the tag; manual runs build the selected branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libasound2-dev libdbus-1-dev libxkbcommon-dev pkg-config
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Build and package
        run: echo "ARCHIVE=$(bash scripts/package-release.sh)" >> "$GITHUB_ENV"
      - name: Smoke-test the packaged CLI
        run: |
          dir="${ARCHIVE%.tar.gz}"
          "$dir/bin/splinely-cli" new --demo --output /tmp/demo.sply
          "$dir/bin/splinely-cli" export /tmp/demo.sply --output /tmp/demo.svg
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Splinely $TAG" --generate-notes
          gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber

  # --- Windows and macOS packages (PLAN.md item 4) ---------------------------------------------
  # Configured from Linux; these jobs have NOT run on GitHub and the packages have not been
  # started on real Windows/macOS hardware. The Linux job above is unchanged.

  windows-x86_64:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Build and package
        shell: pwsh
        run: |
          $archive = ./scripts/package-release.ps1 | Select-Object -Last 1
          "ARCHIVE=$archive" >> $env:GITHUB_ENV
      - name: Smoke-test the packaged CLI (unpacked from the zip)
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'smoke'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $work
          Expand-Archive -Path $env:ARCHIVE -DestinationPath $work
          $bin = (Get-ChildItem $work -Directory | Select-Object -First 1).FullName + '\bin'
          function Run { & $args[0] $args[1..($args.Length - 1)]; if ($LASTEXITCODE -ne 0) { throw "failed: $args" } }
          Run "$bin\splinely-cli.exe" --version
          Run "$bin\splinely.exe" --version
          Run "$bin\splinely-cli.exe" new --demo --output "$work\demo.sply"
          Run "$bin\splinely-cli.exe" export "$work\demo.sply" --output "$work\demo.svg"
          Run "$bin\splinely-cli.exe" convert "$work\demo.sply" --output "$work\demo.json"
          Run "$bin\splinely-cli.exe" convert "$work\demo.json" --output "$work\back.sply"
          if (-not (Test-Path "$work\demo.svg")) { throw 'no svg exported' }
          if (-not (Test-Path "$work\back.sply")) { throw 'no sply converted back' }
      - name: Upload to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Splinely $TAG" --generate-notes
          gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber

  macos-aarch64:
    runs-on: macos-14
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Build and package
        run: echo "ARCHIVE=$(bash scripts/package-release.sh)" >> "$GITHUB_ENV"
      - name: Smoke-test the packaged CLI
        run: |
          work=$(mktemp -d)
          (cd "$(dirname "$ARCHIVE")" && shasum -a 256 -c "$(basename "$ARCHIVE").sha256")
          tar -xzf "$ARCHIVE" -C "$work"
          cli=$(echo "$work"/splinely-*/bin/splinely-cli)
          "$cli" --version
          "$cli" new --demo --output "$work/demo.sply"
          "$cli" export "$work/demo.sply" --output "$work/demo.svg"
          "$cli" convert "$work/demo.sply" --output "$work/demo.json"
          "$cli" convert "$work/demo.json" --output "$work/back.sply"
          codesign --verify --verbose "$cli"
          test -s "$work/demo.svg" && test -s "$work/back.sply"
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Splinely $TAG" --generate-notes
          gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber

  # Intel Mac. The task asked for macos-13; GitHub announced its retirement (late 2025) and
  # offers macos-15-intel as the remaining Intel image. UNVERIFIED label: confirm it exists
  # for this repository before relying on this job.
  macos-x86_64:
    runs-on: macos-15-intel
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Build and package
        run: echo "ARCHIVE=$(bash scripts/package-release.sh)" >> "$GITHUB_ENV"
      - name: Smoke-test the packaged CLI
        run: |
          work=$(mktemp -d)
          (cd "$(dirname "$ARCHIVE")" && shasum -a 256 -c "$(basename "$ARCHIVE").sha256")
          tar -xzf "$ARCHIVE" -C "$work"
          cli=$(echo "$work"/splinely-*/bin/splinely-cli)
          "$cli" --version
          "$cli" new --demo --output "$work/demo.sply"
          "$cli" export "$work/demo.sply" --output "$work/demo.svg"
          "$cli" convert "$work/demo.sply" --output "$work/demo.json"
          "$cli" convert "$work/demo.json" --output "$work/back.sply"
          codesign --verify --verbose "$cli"
          test -s "$work/demo.svg" && test -s "$work/back.sply"
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Splinely $TAG" --generate-notes
          gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
