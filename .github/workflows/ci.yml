name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libasound2-dev libdbus-1-dev libxkbcommon-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: bash scripts/check.sh

  # Real-browser matrix (docs/browser-tests.md, PLAN.md item 9). Separate job so that `check` stays untouched.
  # NOTE: this job has not been executed on GitHub yet; it was developed and run locally (see docs/browser-tests.md).
  browser-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLAYWRIGHT_VERSION: "1.64.0"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      SPLINELY_SCRATCH: ${{ runner.temp }}/splinely-scratch
      MATRIX_OUT: ${{ runner.temp }}/browser-matrix-results
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
      # The matrix only needs the CLI (export/evaluate/cat/isolated-preview); it never builds anything itself.
      - run: cargo build -p splinely-cli
      - name: Install Playwright and its browsers (chromium, firefox, webkit) with system dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/pw/node_modules/playwright" >> "$GITHUB_ENV"
      # Blocking leg: all smoke scenarios in all three engines + cross-browser numeric comparison.
      # Exit code 3 ("incomplete", something was skipped) fails the job on purpose: a skip is not a pass.
      - name: Browser matrix (chromium + firefox + webkit)
        run: bash scripts/browser-matrix.sh --audio none --out-dir "$MATRIX_OUT"
      # Non-blocking leg: audible output + latency through a PulseAudio null sink. Hosted runners have no sound
      # card, so a failure here is reported (artifact + log) but does not fail the job.
      - name: Install PulseAudio and ffmpeg for the audio leg
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils ffmpeg
          pulseaudio --start --exit-idle-time=-1 --log-target=stderr || true
          pactl info
      - name: Audible output and latency (null sink, chromium + firefox)
        continue-on-error: true
        run: |
          mkdir -p "$MATRIX_OUT"
          status=0
          for engine in chromium firefox; do
            node scripts/browser-audio-latency.cjs --browser "$engine" --runs 3 --out "$MATRIX_OUT/audio-$engine.json" || status=$?
          done
          exit $status
      - name: Upload matrix results (JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-matrix-results
          path: ${{ runner.temp }}/browser-matrix-results/
          if-no-files-found: warn

  # Windows and macOS (PLAN.md item 4). Compile-verified only so far: the same workspace was
  # type-checked and clippy-clean from Linux for x86_64-pc-windows-gnu/-msvc (check only) and
  # aarch64/x86_64-apple-darwin, but this job has NOT run on GitHub yet. Build and clippy block;
  # the test step is non-blocking until it has been seen green on real Windows/macOS runners.
  # The Linux `check` job (fmt, scripts/check.sh with Node/Python) is unchanged.
  portable:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - name: Tests (non-blocking until verified on real hardware)
        continue-on-error: true
        run: cargo test --workspace
